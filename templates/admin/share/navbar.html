<!-- Admin Top Navbar Component -->
<header class="topbar">
    <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebar-toggle">
            <i class="fas fa-bars"></i>
        </button>
        <div class="breadcrumb-nav">
            <span class="breadcrumb-item"><a href="{{ url_for('admin_dashboard') }}">Home</a></span>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-item active">{% block breadcrumb_item %}Admin Panel{% endblock %}</span>
        </div>
    </div>
    <div class="topbar-right">
        <div class="topbar-icon" title="Fullscreen" id="fullscreen-btn">
            <i class="fas fa-expand-arrows-alt"></i>
        </div>
        <div class="topbar-user-menu" id="user-menu-toggle">
            {% if logged_in_user_pic %}
            <img src="{{ logged_in_user_pic }}" alt="Avatar" class="topbar-avatar">
            {% else %}
            <div class="topbar-avatar-initials">
                {{ (logged_in_user_display_name or logged_in_user or 'AD')[:2] | upper }}
            </div>
            {% endif %}
            <span class="topbar-username">{{ logged_in_user_display_name if logged_in_user_display_name else 'Administrator' }}</span>
            <div class="user-dropdown" id="user-dropdown">
                <a href="{{ url_for('profile') }}"><i class="fas fa-user"></i> Profile</a>
                <a href="{{ url_for('home') }}"><i class="fas fa-store"></i> View Store</a>
                <div class="dropdown-divider"></div>
                <a href="{{ url_for('logout') }}" class="text-danger"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </div>
</header>
